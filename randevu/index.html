<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b0b0b"><meta name="description" content="Furkan Şimşek Berber online randevu uygulaması"><link rel="manifest" href="manifest.webmanifest"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black"><meta name="apple-mobile-web-app-title" content="Furkan Barber"><title>Online Randevu | Furkan Şimşek Berber</title><link rel="stylesheet" href="style.css"></head><body><section class="section appointment" style="min-height:100vh"><div class="section-head"><p class="eyebrow">FURKAN ŞİMŞEK BERBER</p><h1>Online <em>Randevu</em></h1><button id="notifyBtn" class="btn" type="button">🔔 Hatırlatıcıları Aç</button></div><form id="appointmentForm" class="appointment-form"><div class="field"><label>Ad Soyad</label><input name="name" required></div><div class="field"><label>Telefon</label><input name="phone" required></div><div class="field"><label>Hizmet</label><select name="service" required><option value="">Seçin</option><option>Saç Kesimi — 500 TL</option><option>Sakal Kesimi — 200 TL</option><option>Saç + Sakal Kesimi — 700 TL</option><option>Ağda / İp — 200 TL</option><option>Maske / Cilt Bakımı — 300 TL</option></select></div><div class="field"><label>Tarih</label><input id="date" name="date" type="date" required></div><div class="field full"><label>Uygun Saat</label><div id="timeSlots" class="time-slots"></div><input id="selectedTime" name="time" type="hidden"></div><div class="field full"><label>Not</label><textarea name="note" rows="3"></textarea></div><button class="btn primary full" type="submit">Randevuyu Oluştur →</button><p id="bookingStatus" class="booking-status"></p></form></section><script src="pwa.js"></script><script src="booking.js"></script><script>document.querySelector('#notifyBtn')?.addEventListener('click',async()=>{const r=await windo
