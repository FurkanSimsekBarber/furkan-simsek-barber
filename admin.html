<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Randevu Yönetimi | Furkan Şimşek Berber</title>

<link rel="stylesheet" href="css/style.css">

<style>
.admin {
    max-width: 1200px;
    margin: 0 auto;
    padding: 45px 22px 80px;
    min-height: 100vh;
}

.admin-head {
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:20px;
    margin-bottom:35px;
}

.admin-title .eyebrow {
    margin-bottom:10px;
}

.admin-title h1 {
    margin:0;
    font-size:clamp(38px,6vw,72px);
    line-height:1;
}

.admin-title h1 em {
    font-family:"Playfair Display",serif;
    font-weight:600;
}

.admin-tools {
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    margin-bottom:25px;
}

.admin-tools input {
    background:#0b0b0b;
    color:#fff;
    border:1px solid #333;
    padding:13px 15px;
    min-height:46px;
}

.admin-tools button {
    cursor:pointer;
}

.admin-card {
    background:#121212;
    border:1px solid #292929;
    padding:25px;
    border-radius:14px;
    margin-bottom:20px;
}

.hidden {
    display:none !important;
}


/* ==============================
   LOGIN
============================== */

.login-box {
    max-width:500px;
}

.login-box h2 {
    margin-bottom:8px;
}

.login-box p {
    color:#888;
    font-size:14px;
    margin-bottom:20px;
}

.login-input {
    width:100%;
    background:#0a0a0a;
    color:#fff;
    border:1px solid #333;
    padding:15px;
    margin-bottom:12px;
    outline:none;
}

.login-input:focus {
    border-color:#aaa;
}

.login-error {
    margin-top:12px;
}


/* ==============================
   İSTATİSTİKLER
============================== */

.stats {
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:12px;
    margin-bottom:12px;
}

.stat {
    background:#121212;
    border:1px solid #292929;
    padding:22px;
    border-radius:14px;
}

.stat-number {
    font-size:34px;
    font-weight:700;
    line-height:1;
    margin-bottom:9px;
}

.stat-label {
    color:#888;
    font-size:11px;
    letter-spacing:1px;
    text-transform:uppercase;
}

.stat.pending .stat-number {
    color:#e0aa55;
}

.stat.approved .stat-number {
    color:#67d695;
}

.stat.cancelled .stat-number {
    color:#e87979;
}


/* ==============================
   CİRO
============================== */

.revenue {
    background:#f3f3f3;
    color:#111;
    border-radius:14px;
    padding:24px;
    margin-bottom:25px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:20px;
}

.revenue-label {
    font-size:11px;
    letter-spacing:2px;
    color:#777;
    text-transform:uppercase;
}

.revenue-value {
    font-size:32px;
    font-weight:700;
}


/* ==============================
   PANEL ÜSTÜ
============================== */

.panel-top {
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:15px;
    margin-bottom:10px;
}

.panel-top h2 {
    font-size:20px;
}

.refresh-btn,
.logout-btn {
    background:#222;
    color:#fff;
    border:1px solid #444;
    padding:10px 14px;
    cursor:pointer;
    border-radius:7px;
}

.logout-btn:hover,
.refresh-btn:hover {
    background:#333;
}


/* ==============================
   RANDEVU
============================== */

.appt {
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:25px;
    padding:22px 0;
    border-bottom:1px solid #292929;
}

.appt:last-child {
    border-bottom:0;
}

.appt-main {
    min-width:0;
}

.appt-time {
    font-size:13px;
    letter-spacing:2px;
    color:#999;
    margin-bottom:5px;
}

.appt-name {
    font-size:20px;
    font-weight:700;
    margin-bottom:7px;
}

.appt-details {
    color:#888;
    font-size:13px;
    line-height:1.8;
}

.appt-code {
    color:#666;
    font-size:11px;
    margin-top:6px;
    letter-spacing:1px;
}

.actions {
    display:flex;
    align-items:center;
    justify-content:flex-end;
    gap:8px;
    flex-wrap:wrap;
    flex-shrink:0;
}

.actions button,
.whatsapp-btn {
    border:0;
    padding:9px 13px;
    border-radius:7px;
    cursor:pointer;
    font-size:12px;
    font-weight:700;
    text-decoration:none;
    display:inline-flex;
    align-items:center;
    justify-content:center;
}

.whatsapp-btn {
    background:#25D366;
    color:#fff;
}

.approve-btn {
    background:#2e8b57;
    color:#fff;
}

.cancel-btn {
    background:#a83232;
    color:#fff;
}

.approve-btn:hover,
.cancel-btn:hover,
.whatsapp-btn:hover {
    opacity:.85;
}


/* ==============================
   DURUM
============================== */

.status {
    padding:7px 11px;
    border-radius:20px;
    font-size:11px;
    white-space:nowrap;
    border:1px solid transparent;
}

.status.approved {
    background:rgba(46,139,87,.18);
    border-color:#2e8b57;
    color:#75df9d;
}

.status.pending {
    background:rgba(183,121,31,.18);
    border-color:#b7791f;
    color:#e8b967;
}

.status.cancelled {
    background:rgba(168,50,50,.18);
    border-color:#a83232;
    color:#ed8585;
}


/* ==============================
   MESAJLAR
============================== */

.err {
    color:#ff7777;
}

.success {
    color:#62d993;
}

.loading {
    color:#777;
}

.empty {
    padding:40px 0;
    color:#777;
    text-align:center;
}


/* ==============================
   MOBİL
============================== */

@media(max-width:900px) {

    .stats {
        grid-template-columns:repeat(2,1fr);
    }

}

@media(max-width:700px) {

    .admin {
        padding:30px 16px 60px;
    }

    .admin-head {
        flex-direction:column;
        align-items:flex-start;
    }

    .admin-head .btn {
        width:100%;
        text-align:center;
    }

    .admin-tools {
        display:grid;
        grid-template-columns:1fr;
    }

    .admin-tools input,
    .admin-tools button {
        width:100%;
    }

    .revenue {
        flex-direction:column;
        align-items:flex-start;
    }

    .appt {
        flex-direction:column;
        align-items:flex-start;
        gap:15px;
    }

    .actions {
        width:100%;
        justify-content:flex-start;
    }

    .actions button,
    .whatsapp-btn {
        flex:1;
    }

}

@media(max-width:480px) {

    .stats {
        grid-template-columns:1fr 1fr;
    }

    .stat {
        padding:17px;
    }

    .stat-number {
        font-size:27px;
    }

    .revenue-value {
        font-size:28px;
    }

}
</style>
</head>

<body>

<main class="admin">

    <!-- ==========================
         BAŞLIK
    =========================== -->

    <div class="admin-head">

        <div class="admin-title">

            <p class="eyebrow">
                FURKAN ŞİMŞEK BERBER
            </p>

            <h1>
                Randevu <em>Yönetimi</em>
            </h1>

        </div>

        <a class="btn" href="index.html">
            ← Siteye Dön
        </a>

    </div>


    <!-- ==========================
         TARİH ARAÇLARI
    =========================== -->

    <div class="admin-tools">

        <input
            id="adminDate"
            type="date"
        >

        <button
            id="loadBtn"
            class="btn primary"
        >
            Randevuları Getir
        </button>

        <button
            id="todayBtn"
            class="btn"
        >
            Bugün
        </button>

    </div>


    <!-- ==========================
         GİRİŞ
    =========================== -->

    <div
        id="adminLogin"
        class="admin-card login-box"
    >

        <h2>Yönetici Girişi</h2>

        <p>
            Randevularınızı yönetmek için yönetici şifrenizi girin.
        </p>

        <input
            id="token"
            class="login-input"
            type="password"
            placeholder="Yönetici şifresi"
        >

        <button
            id="saveToken"
            class="btn primary"
        >
            Giriş Yap →
        </button>

        <p
            id="loginError"
            class="err"
        ></p>

    </div>


    <!-- ==========================
         ADMİN ALANI
    =========================== -->

    <div
        id="adminArea"
        class="hidden"
    >

        <!-- İSTATİSTİKLER -->

        <div class="stats">

            <div class="stat">

                <div
                    class="stat-number"
                    id="totalCount"
                >
                    0
                </div>

                <div class="stat-label">
                    Toplam Randevu
                </div>

            </div>


            <div class="stat pending">

                <div
                    class="stat-number"
                    id="pendingCount"
                >
                    0
                </div>

                <div class="stat-label">
                    Onay Bekliyor
                </div>

            </div>


            <div class="stat approved">

                <div
                    class="stat-number"
                    id="approvedCount"
                >
                    0
                </div>

                <div class="stat-label">
                    Onaylandı
                </div>

            </div>


            <div class="stat cancelled">

                <div
                    class="stat-number"
                    id="cancelledCount"
                >
                    0
                </div>

                <div class="stat-label">
                    İptal
                </div>

            </div>

        </div>


        <!-- CİRO -->

        <div class="revenue">

            <div>

                <div class="revenue-label">
                    Günlük Tahmini Ciro
                </div>

                <div
                    class="revenue-value"
                    id="revenue"
                >
                    0 TL
                </div>

            </div>

            <div
                id="summary"
                style="color:#777;font-size:13px;"
            >
                Yükleniyor...
            </div>

        </div>


        <!-- RANDEVU PANELİ -->

        <div class="admin-card">

            <div class="panel-top">

                <h2>
                    Randevular
                </h2>

                <div style="display:flex;gap:8px;">

                    <button
                        id="refreshBtn"
                        class="refresh-btn"
                    >
                        ↻ Yenile
                    </button>

                    <button
                        id="logoutBtn"
                        class="logout-btn"
                    >
                        Çıkış
                    </button>

                </div>

            </div>


            <div
                id="appointments"
            ></div>

        </div>

    </div>

</main>


<script>

/* =========================================
   API
========================================= */

const API =
"https://script.google.com/macros/s/AKfycbwg4JbCvLdtQgIQeU0mWdxnCRIvmzLAPg5RVK8RaX5GxBGb9ndyQBuM6aau_VyTcD2WKA/exec";


/* =========================================
   DEĞİŞKENLER
========================================= */

let token =
localStorage.getItem("berber_admin_token") || "";


const date =
document.querySelector("#adminDate");

const login =
document.querySelector("#adminLogin");

const area =
document.querySelector("#adminArea");

const appointments =
document.querySelector("#appointments");

const summary =
document.querySelector("#summary");

const loginError =
document.querySelector("#loginError");


/* =========================================
   FİYATLAR
========================================= */

const PRICES = {

    "Saç Kesimi": 500,

    "Sakal Kesimi": 200,

    "Saç + Sakal Kesimi": 700,

    "Ağda / İp": 200,

    "Maske / Cilt Bakımı": 300

};


/* =========================================
   TARİH
========================================= */

function today() {

    return new Date()
        .toISOString()
        .slice(0,10);

}


date.value = today();


/* =========================================
   GİRİŞ
========================================= */

function auth() {

    if (!token) {

        login.classList.remove("hidden");

        area.classList.add("hidden");

        return;

    }


    login.classList.add("hidden");

    area.classList.remove("hidden");

    load();

}


/* =========================================
   GİRİŞ BUTONU
========================================= */

document
.querySelector("#saveToken")
.onclick = function() {

    const value =
        document
        .querySelector("#token")
        .value
        .trim();


    if (!value) {

        loginError.textContent =
            "Lütfen yönetici şifresini girin.";

        return;

    }


    token = value;


    localStorage.setItem(
        "berber_admin_token",
        token
    );


    loginError.textContent = "";


    auth();

};


/* =========================================
   ENTER
========================================= */

document
.querySelector("#token")
.addEventListener(
    "keydown",
    function(e) {

        if (e.key === "Enter") {

            document
            .querySelector("#saveToken")
            .click();

        }

    }
);


/* =========================================
   BUGÜN
========================================= */

document
.querySelector("#todayBtn")
.onclick = function() {

    date.value = today();

    load();

};


/* =========================================
   GETİR
========================================= */

document
.querySelector("#loadBtn")
.onclick = load;


/* =========================================
   YENİLE
========================================= */

document
.querySelector("#refreshBtn")
.onclick = load;


/* =========================================
   ÇIKIŞ
========================================= */

document
.querySelector("#logoutBtn")
.onclick = function() {

    if (
        !confirm(
            "Yönetici oturumunu kapatmak istiyor musunuz?"
        )
    ) {

        return;

    }


    localStorage.removeItem(
        "berber_admin_token"
    );


    token = "";


    area.classList.add("hidden");

    login.classList.remove("hidden");


    document
    .querySelector("#token")
    .value = "";

};


/* =========================================
   RANDEVULARI GETİR
========================================= */

async function load() {

    if (!token) {

        return;

    }


    appointments.innerHTML =
        '<p class="loading">Randevular yükleniyor...</p>';


    summary.textContent =
        "Yükleniyor...";


    try {

        const response =
            await fetch(
                `${API}?action=list&token=${encodeURIComponent(token)}&date=${encodeURIComponent(date.value)}`
            );


        const data =
            await response.json();


        if (!data.ok) {

            appointments.innerHTML =
                `<p class="err">${escapeHtml(data.error || "Randevular alınamadı.")}</p>`;


            summary.textContent =
                "Randevular alınamadı.";


            return;

        }


        renderAppointments(data.rows);


    } catch (error) {

        appointments.innerHTML =
            `<p class="err">
                API bağlantısı kurulamadı.
            </p>`;


        summary.textContent =
            "Bağlantı hatası.";

    }

}


/* =========================================
   RANDEVULARI GÖSTER
========================================= */

function renderAppointments(rows) {

    /* Saat sırası */

    rows.sort(function(a,b) {

        return String(a.time)
            .localeCompare(
                String(b.time)
            );

    });


    /* İSTATİSTİK */

    const total =
        rows.length;


    const pending =
        rows.filter(
            x => x.status === "Onay Bekliyor"
        ).length;


    const approved =
        rows.filter(
            x => x.status === "Onaylandı"
        ).length;


    const cancelled =
        rows.filter(
            x => x.status === "İptal"
        ).length;


    document.querySelector("#totalCount")
        .textContent = total;


    document.querySelector("#pendingCount")
        .textContent = pending;


    document.querySelector("#approvedCount")
        .textContent = approved;


    document.querySelector("#cancelledCount")
        .textContent = cancelled;


    /* CİRO */

    let revenue = 0;


    rows.forEach(function(x) {

        if (x.status === "İptal") {

            return;

        }


        revenue += getPrice(x.service);

    });


    document.querySelector("#revenue")
        .textContent =
            formatMoney(revenue);


    summary.textContent =
        `${date.value} — ${total} randevu`;


    appointments.innerHTML = "";


    if (!rows.length) {

        appointments.innerHTML =
            `<div class="empty">
                Bu tarihte randevu bulunmuyor.
            </div>`;

        return;

    }


    rows.forEach(function(x) {

        const el =
            document.createElement("div");


        el.className = "appt";


        const statusClass =
            getStatusClass(x.status);


        /* Telefon */

        const phone =
            String(x.phone || "")
            .replace(/\D/g,"");


        let whatsappNumber = phone;


        if (
            whatsappNumber.startsWith("0")
        ) {

            whatsappNumber =
                "90" +
                whatsappNumber.substring(1);

        }


        if (
            !whatsappNumber.startsWith("90")
        ) {

            whatsappNumber =
                "90" +
                whatsappNumber;

        }


        /* WhatsApp */

        const message =
            encodeURIComponent(
                `Merhaba ${x.name}, Furkan Şimşek Berber'den yazıyorum. Randevunuz: ${x.date} ${x.time}. Hizmet: ${x.service}. Randevu Kodunuz: ${x.id}`
            );


        /* Butonlar */

        let actionButtons = "";


        if (
            x.status !== "Onaylandı" &&
            x.status !== "İptal"
        ) {

            actionButtons += `

                <button
                    class="approve-btn"
                    data-id="${escapeHtml(x.id)}"
                    data-status="Onaylandı"
                >
                    ✓ Onayla
                </button>

            `;

        }


        if (x.status !== "İptal") {

            actionButtons += `

                <button
                    class="cancel-btn"
                    data-id="${escapeHtml(x.id)}"
                    data-status="İptal"
                >
                    ✕ İptal
                </button>

            `;

        }


        el.innerHTML = `

            <div class="appt-main">

                <div class="appt-time">
                    ${escapeHtml(x.time)}
                </div>

                <div class="appt-name">
                    ${escapeHtml(x.name)}
                </div>

                <div class="appt-details">

                    ✂️ ${escapeHtml(x.service)}

                    <br>

                    📞 ${escapeHtml(x.phone)}

                    ${
                        x.note
                        ?
                        `<br>📝 ${escapeHtml(x.note)}`
                        :
                        ""
                    }

                </div>

                <div class="appt-code">

                    RANDEVU KODU:
                    ${escapeHtml(x.id)}

                </div>

            </div>


            <div class="actions">

                <span
                    class="status ${statusClass}"
                >
                    ${escapeHtml(x.status)}
                </span>


                <a
                    class="whatsapp-btn"
                    href="https://wa.me/${whatsappNumber}?text=${message}"
                    target="_blank"
                    rel="noopener"
                >
                    WhatsApp
                </a>


                ${actionButtons}

            </div>

        `;


        el
        .querySelectorAll("button")
        .forEach(function(button) {

            button.onclick =
                function() {

                    changeStatus(
                        button.dataset.id,
                        button.dataset.status
                    );

                };

        });


        appointments.appendChild(el);

    });

}


/* =========================================
   FİYAT
========================================= */

function getPrice(service) {

    const name =
        String(service || "")
        .toLowerCase();


    if (
        name.includes("saç + sakal") ||
        name.includes("saç sakal")
    ) {

        return 700;

    }


    if (
        name.includes("saç kesimi")
    ) {

        return 500;

    }


    if (
        name.includes("sakal kesimi")
    ) {

        return 200;

    }


    if (
        name.includes("ağda") ||
        name.includes("ip")
    ) {

        return 200;

    }


    if (
        name.includes("maske") ||
        name.includes("cilt")
    ) {

        return 300;

    }


    return 0;

}


/* =========================================
   PARA
========================================= */

function formatMoney(value) {

    return new Intl.NumberFormat(
        "tr-TR",
        {
            style:"currency",
            currency:"TRY",
            maximumFractionDigits:0
        }
    ).format(value);

}


/* =========================================
   DURUM
========================================= */

function getStatusClass(status) {

    if (status === "Onaylandı") {

        return "approved";

    }


    if (status === "İptal") {

        return "cancelled";

    }


    return "pending";

}


/* =========================================
   DURUM DEĞİŞTİR
========================================= */

async function changeStatus(
    id,
    status
) {

    const question =
        status === "Onaylandı"
        ?
        "Bu randevuyu onaylamak istiyor musunuz?"
        :
        "Bu randevuyu iptal etmek istiyor musunuz?";


    if (!confirm(question)) {

        return;

    }


    try {

        const response =
            await fetch(
                API,
                {
                    method:"POST",

                    headers:{
                        "Content-Type":
                        "text/plain;charset=utf-8"
                    },

                    body:JSON.stringify({

                        action:"status",

                        token:token,

                        id:id,

                        status:status

                    })

                }
            );


        const data =
            await response.json();


        if (!data.ok) {

            alert(
                data.error ||
                "İşlem gerçekleştirilemedi."
            );

            return;

        }


        await load();


    } catch(error) {

        alert(
            "Sunucuya bağlanırken hata oluştu."
        );

    }

}


/* =========================================
   HTML GÜVENLİĞİ
========================================= */

function escapeHtml(value) {

    return String(value || "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


/* =========================================
   BAŞLAT
========================================= */

auth();

</script>

</body>
</html>
