<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Randevu Takvimi | Furkan Şimşek Berber</title>
<link rel="stylesheet" href="css/style.css">
<style>
:root{--admin-bg:#080808;--admin-panel:#121212;--admin-line:#292929;--admin-muted:#888;--green:#67d695;--yellow:#e8b967;--red:#ed8585}
body{background:var(--admin-bg)}
.admin{max-width:1320px;margin:0 auto;padding:42px 22px 90px;min-height:100vh}
.admin-head{display:flex;justify-content:space-between;align-items:end;gap:20px;margin-bottom:28px}
.admin-title .eyebrow{margin-bottom:10px}.admin-title h1{margin:0;font-size:clamp(40px,6vw,76px);line-height:.95}.admin-title h1 em{font-family:"Playfair Display",serif;font-weight:600}
.hidden{display:none!important}.login-card,.panel{background:var(--admin-panel);border:1px solid var(--admin-line);border-radius:16px;padding:24px}
.login-card{max-width:520px}.login-card h2{margin-bottom:8px}.muted{color:var(--admin-muted);font-size:13px}
.login-input,.date-input,.filter-select{width:100%;background:#0a0a0a;color:#fff;border:1px solid #333;padding:14px;border-radius:9px;outline:none}.login-input{margin:15px 0 10px}.login-input:focus,.date-input:focus,.filter-select:focus{border-color:#aaa}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px}.toolbar>*{min-height:44px}.toolbar .date-input{width:auto;min-width:175px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px}.stat{background:#121212;border:1px solid #292929;border-radius:14px;padding:20px}.stat-number{font-size:32px;font-weight:700;line-height:1;margin-bottom:8px}.stat-label{font-size:10px;letter-spacing:1.5px;color:#777;text-transform:uppercase}.pending .stat-number{color:var(--yellow)}.approved .stat-number{color:var(--green)}.cancelled .stat-number{color:var(--red)}
.calendar-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}.calendar-title{font-size:22px;font-weight:700}.calendar-nav{display:flex;gap:7px}.icon-btn{width:42px;height:42px;border:1px solid #3a3a3a;background:#181818;color:#fff;border-radius:9px;cursor:pointer}.icon-btn:hover{background:#252525}
.weekdays,.calendar-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:7px}.weekday{font-size:10px;letter-spacing:1px;color:#777;text-align:center;padding:8px 0}.day{min-height:105px;background:#0d0d0d;border:1px solid #242424;border-radius:10px;padding:9px;cursor:pointer;transition:.2s}.day:hover{border-color:#666;transform:translateY(-1px)}.day.other{opacity:.28}.day.today{border-color:#aaa}.day.selected{border-color:#fff;box-shadow:inset 0 0 0 1px #fff}.day.closed{background:#0a0a0a}.day-number{font-size:13px;font-weight:700}.day-meta{margin-top:12px;font-size:10px;color:#777}.day-dots{display:flex;gap:4px;flex-wrap:wrap;margin-top:9px}.dot{width:7px;height:7px;border-radius:50%;background:#555}.dot.pending{background:var(--yellow)}.dot.approved{background:var(--green)}.dot.cancelled{background:var(--red)}
.legend{display:flex;gap:15px;flex-wrap:wrap;margin-top:14px;color:#777;font-size:10px}.legend span{display:inline-flex;align-items:center;gap:6px}.legend i{width:7px;height:7px;border-radius:50%;background:#555}.legend .p i{background:var(--yellow)}.legend .a i{background:var(--green)}.legend .c i{background:var(--red)}
.day-panel{margin-top:18px}.day-panel-head{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:14px}.day-panel-head h2{font-size:21px}.day-total{color:#777;font-size:12px}.appt{display:flex;align-items:center;justify-content:space-between;gap:20px;padding:17px 0;border-top:1px solid #292929}.appt-main{min-width:0}.appt-time{font-size:12px;color:#aaa;letter-spacing:1.5px;margin-bottom:4px}.appt-name{font-size:18px;font-weight:700}.appt-details{font-size:12px;color:#777;line-height:1.7;margin-top:4px}.appt-note{font-size:11px;color:#666;margin-top:4px}.appt-code{font-size:9px;color:#555;letter-spacing:1px;margin-top:5px}.actions{display:flex;gap:7px;flex-wrap:wrap;justify-content:flex-end;flex-shrink:0}.action-btn{border:1px solid #444;background:#1b1b1b;color:#fff;padding:9px 11px;border-radius:7px;cursor:pointer;font-size:11px;font-weight:700}.action-btn:hover{background:#292929}.approve-btn{border-color:#2e8b57;color:#75df9d}.cancel-btn{border-color:#a83232;color:#ed8585}.whatsapp-btn{border-color:#2e8b57;color:#75df9d;text-decoration:none}.empty{padding:34px 0;text-align:center;color:#666;font-size:13px}.loading{padding:25px;color:#777}.error{color:#ff7777;margin-top:10px;font-size:12px}.success{color:#62d993;margin-top:10px;font-size:12px}
.revenue{margin-top:18px;background:#f3f3f3;color:#111;border-radius:14px;padding:20px 22px;display:flex;justify-content:space-between;align-items:center;gap:20px}.revenue-label{font-size:10px;letter-spacing:2px;color:#777}.revenue-value{font-size:28px;font-weight:700}
@media(max-width:900px){.stats{grid-template-columns:repeat(2,1fr)}.day{min-height:85px}.day-meta{margin-top:7px}}
@media(max-width:650px){.admin{padding:28px 12px 70px}.admin-head{align-items:flex-start;flex-direction:column}.admin-head .btn{width:100%;text-align:center}.toolbar{display:grid;grid-template-columns:1fr}.toolbar .date-input{width:100%}.calendar-head{align-items:flex-start}.calendar-title{font-size:18px}.weekdays,.calendar-grid{gap:3px}.weekday{font-size:8px}.day{min-height:64px;padding:6px;border-radius:7px}.day-number{font-size:11px}.day-meta{font-size:8px;margin-top:5px}.dot{width:5px;height:5px}.appt{align-items:flex-start;flex-direction:column;gap:12px}.actions{width:100%;justify-content:flex-start}.action-btn{flex:1}.revenue{align-items:flex-start;flex-direction:column}.stats{gap:7px}.stat{padding:15px}.stat-number{font-size:25px}}
</style>
</head>
<body>
<main class="admin">
<div class="admin-head"><div class="admin-title"><p class="eyebrow">FURKAN ŞİMŞEK BERBER</p><h1>Randevu <em>Takvimi</em></h1></div><a class="btn" href="index.html">← Siteye Dön</a></div>

<div id="loginCard" class="login-card">
<h2>Yönetici Girişi</h2><p class="muted">Randevularınızı görmek ve onaylamak için yönetici şifrenizi girin.</p>
<input id="token" class="login-input" type="password" placeholder="Yönetici şifresi" autocomplete="current-password">
<button id="loginBtn" class="btn primary">Giriş Yap →</button><p id="loginError" class="error"></p>
</div>

<div id="adminArea" class="hidden">
<div class="toolbar">
<input id="selectedDate" class="date-input" type="date">
<button id="todayBtn" class="btn primary">Bugün</button>
<button id="refreshBtn" class="btn">↻ Yenile</button>
<button id="logoutBtn" class="btn">Çıkış</button>
</div>

<div class="stats">
<div class="stat"><div id="totalCount" class="stat-number">0</div><div class="stat-label">Toplam Randevu</div></div>
<div class="stat pending"><div id="pendingCount" class="stat-number">0</div><div class="stat-label">Onay Bekliyor</div></div>
<div class="stat approved"><div id="approvedCount" class="stat-number">0</div><div class="stat-label">Onaylandı</div></div>
<div class="stat cancelled"><div id="cancelledCount" class="stat-number">0</div><div class="stat-label">İptal</div></div>
</div>

<section class="panel">
<div class="calendar-head"><div id="calendarTitle" class="calendar-title"></div><div class="calendar-nav"><button id="prevMonth" class="icon-btn" aria-label="Önceki ay">←</button><button id="nextMonth" class="icon-btn" aria-label="Sonraki ay">→</button></div></div>
<div class="weekdays"><div class="weekday">PZT</div><div class="weekday">SAL</div><div class="weekday">ÇAR</div><div class="weekday">PER</div><div class="weekday">CUM</div><div class="weekday">CMT</div><div class="weekday">PAZ</div></div>
<div id="calendarGrid" class="calendar-grid"></div>
<div class="legend"><span class="p"><i></i> Onay bekliyor</span><span class="a"><i></i> Onaylandı</span><span class="c"><i></i> İptal</span></div>
</section>

<div class="revenue"><div><div class="revenue-label">Seçili Gün Tahmini Ciro</div><div id="revenue" class="revenue-value">0 TL</div></div><div id="summary" class="muted">-</div></div>

<section class="panel day-panel">
<div class="day-panel-head"><h2 id="dayTitle">Günün Randevuları</h2><span id="dayTotal" class="day-total"></span></div>
<div id="appointments"></div>
</section>
</div>
</main>

<script>
const API="https://script.google.com/macros/s/AKfycbwg4JbCvLdtQgIQeU0mWdxnCRIvmzLAPg5RVK8RaX5GxBGb9ndyQBuM6aau_VyTcD2WKA/exec";
const TOKEN_KEY="berber_admin_token";
const MONTHS=["Ocak","Şubat","Mart","Nisan","Mayıs","Haziran","Temmuz","Ağustos","Eylül","Ekim","Kasım","Aralık"];
const PRICES={"Saç Kesimi":500,"Sakal Kesimi":200,"Saç + Sakal Kesimi":700,"Ağda / İp":200,"Maske / Cilt Bakımı":300};
let token=localStorage.getItem(TOKEN_KEY)||"";
let rows=[];
let selectedDate=localDate();
let viewDate=new Date(selectedDate+"T12:00:00");

const $=s=>document.querySelector(s);
function localDate(d=new Date()){const x=new Date(d.getTime()-d.getTimezoneOffset()*60000);return x.toISOString().slice(0,10)}
function escapeHtml(v){return String(v??"").replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function statusClass(s){const x=String(s||"").toLowerCase();return x.includes("iptal")?"cancelled":x.includes("onaylandı")?"approved":"pending"}
function formatDate(s){const p=String(s).split("-");return p.length===3?`${p[2]}.${p[1]}.${p[0]}`:s}
function formatLong(s){const d=new Date(s+"T12:00:00");return d.toLocaleDateString("tr-TR",{weekday:"long",day:"numeric",month:"long",year:"numeric"})}
function normalizeService(s){return String(s||"").split(" — ")[0].trim()}
function priceOf(s){return PRICES[normalizeService(s)]||0}

function auth(){if(!token){$("#loginCard").classList.remove("hidden");$("#adminArea").classList.add("hidden");return}$("#loginCard").classList.add("hidden");$("#adminArea").classList.remove("hidden");load()}

$("#loginBtn").onclick=()=>{const v=$("#token").value.trim();if(!v){$("#loginError").textContent="Lütfen yönetici şifresini girin.";return}token=v;localStorage.setItem(TOKEN_KEY,v);$("#loginError").textContent="";load()}
$("#logoutBtn").onclick=()=>{token="";localStorage.removeItem(TOKEN_KEY);auth()}
$("#todayBtn").onclick=()=>{selectedDate=localDate();viewDate=new Date(selectedDate+"T12:00:00");$("#selectedDate").value=selectedDate;render()}
$("#selectedDate").onchange=e=>{selectedDate=e.target.value;if(!selectedDate)return;viewDate=new Date(selectedDate+"T12:00:00");render()}
$("#prevMonth").onclick=()=>{viewDate.setMonth(viewDate.getMonth()-1);renderCalendar()}
$("#nextMonth").onclick=()=>{viewDate.setMonth(viewDate.getMonth()+1);renderCalendar()}
$("#refreshBtn").onclick=load;

async function load(){
 $("#appointments").innerHTML='<div class="loading">Randevular yükleniyor...</div>';
 try{
  const r=await fetch(`${API}?action=list&token=${encodeURIComponent(token)}`);const d=await r.json();
  if(!d.ok){token="";localStorage.removeItem(TOKEN_KEY);auth();$("#loginError").textContent=d.error||"Yetkisiz.";return}
  rows=Array.isArray(d.rows)?d.rows:[];
  render();
 }catch(e){$("#appointments").innerHTML='<div class="error">Randevular yüklenemedi. API bağlantısını kontrol edin.</div>'}
}

function render(){
 $("#selectedDate").value=selectedDate;renderStats();renderCalendar();renderDay();
}

function renderStats(){
 const active=rows.filter(r=>statusClass(r.status)!=="cancelled");
 $("#totalCount").textContent=active.length;
 $("#pendingCount").textContent=rows.filter(r=>statusClass(r.status)==="pending").length;
 $("#approvedCount").textContent=rows.filter(r=>statusClass(r.status)==="approved").length;
 $("#cancelledCount").textContent=rows.filter(r=>statusClass(r.status)==="cancelled").length;
}

function renderCalendar(){
 const y=viewDate.getFullYear(),m=viewDate.getMonth();$("#calendarTitle").textContent=`${MONTHS[m]} ${y}`;
 const first=new Date(y,m,1);const offset=(first.getDay()+6)%7;const days=new Date(y,m+1,0).getDate();const prevDays=new Date(y,m,0).getDate();
 let html="";
 for(let i=0;i<42;i++){
  const n=i-offset+1;let day=n,month=m,year=y,other=false;
  if(n<1){day=prevDays+n;month=m-1;other=true;if(month<0){month=11;year--}}else if(n>days){day=n-days;month=m+1;other=true;if(month>11){month=0;year++}}
  const ds=localDate(new Date(year,month,day));const list=rows.filter(r=>r.date===ds);const today=ds===localDate();const sel=ds===selectedDate;const closed=new Date(ds+"T12:00:00").getDay()===0;
  const active=list.filter(r=>statusClass(r.status)!=="cancelled").length;
  const dots=list.slice(0,7).map(r=>`<i class="dot ${statusClass(r.status)}"></i>`).join("");
  html+=`<button class="day ${other?'other ':''}${today?'today ':''}${sel?'selected ':''}${closed?'closed':''}" data-date="${ds}" ${closed?'title="Pazar kapalı"':''}><div class="day-number">${day}</div>${active?`<div class="day-meta">${active} randevu</div>`:'<div class="day-meta">Müsait</div>'}<div class="day-dots">${dots}</div></button>`;
 }
 $("#calendarGrid").innerHTML=html;
 document.querySelectorAll(".day").forEach(b=>b.onclick=()=>{selectedDate=b.dataset.date;viewDate=new Date(selectedDate+"T12:00:00");render()});
}

function renderDay(){
 const list=rows.filter(r=>r.date===selectedDate).sort((a,b)=>a.time.localeCompare(b.time));
 $("#dayTitle").textContent=formatLong(selectedDate);
 const active=list.filter(r=>statusClass(r.status)!=="cancelled");
 $("#dayTotal").textContent=`${active.length} aktif / ${list.length} toplam`;
 const revenue=active.reduce((sum,r)=>sum+priceOf(r.service),0);$("#revenue").textContent=`${revenue.toLocaleString("tr-TR")} TL`;
 $("#summary").textContent=list.length?`${active.length} aktif randevu · ${list.filter(r=>statusClass(r.status)==="approved").length} onaylı`:'Bu gün için randevu yok';
 if(!list.length){$("#appointments").innerHTML='<div class="empty">Bu tarihte kayıtlı randevu bulunmuyor.</div>';return}
 $("#appointments").innerHTML=list.map(r=>{
  const st=statusClass(r.status);const phone=String(r.phone||"").replace(/\D/g,"");const wa=`https://wa.me/${phone.startsWith("90")?phone:"90"+phone.replace(/^0/,'')}?text=${encodeURIComponent(`Merhaba ${r.name}, Furkan Şimşek Berber randevunuz hakkında bilgi vermek için yazıyorum. Tarih: ${formatDate(r.date)} Saat: ${r.time}`)}`;
  return `<article class="appt"><div class="appt-main"><div class="appt-time">${escapeHtml(r.time)} · <span class="status ${st}">${escapeHtml(r.status)}</span></div><div class="appt-name">${escapeHtml(r.name)}</div><div class="appt-details">${escapeHtml(normalizeService(r.service))} · ${escapeHtml(r.phone)}</div>${r.note?`<div class="appt-note">Not: ${escapeHtml(r.note)}</div>`:''}<div class="appt-code">KOD: ${escapeHtml(r.id)}</div></div><div class="actions">${st!=="approved"&&st!=="cancelled"?`<button class="action-btn approve-btn" onclick="changeStatus('${escapeHtml(r.id)}','Onaylandı')">✓ Onayla</button>`:''}${st!=="cancelled"?`<button class="action-btn cancel-btn" onclick="changeStatus('${escapeHtml(r.id)}','İptal')">İptal</button>`:''}<a class="action-btn whatsapp-btn" href="${wa}" target="_blank" rel="noopener">WhatsApp</a></div></article>`
 }).join("");
}

async function changeStatus(id,status){
 try{
  const r=await fetch(API,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({action:"status",token,id,status})});const d=await r.json();
  if(!d.ok){alert(d.error||"İşlem başarısız.");return}await load();
 }catch(e){alert("İşlem sırasında bağlantı hatası oluştu.")}
}

$("#token").addEventListener("keydown",e=>{if(e.key==="Enter")$("#loginBtn").click()});
auth();
</script>
</body>
</html>
